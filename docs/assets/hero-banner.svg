    </text>
  </g>

  <!-- Status badge top-right -->
  <g transform="translate(950, 52)">
    <rect x="0" y="0" width="206" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#10B981"/>
    <text x="34" y="21.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0">
      LIVE · VERCEL + SUPABASE
    </text>
  </g>

  <!-- Divider -->
  <line x1="44" y1="244" x2="1156" y2="244" stroke="#1E293B" stroke-width="1.2"/>

  <!-- 5 Bottom Feature Pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Pill 1 -->
    <rect x="44" y="266" width="210" height="82" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="44" y="266" width="210" height="3" rx="1.5" fill="#10B981"/>
    <text x="60" y="294" font-size="13.5" font-weight="700" fill="#34D399">Zero-LLM IRDAI Math</text>
    <text x="60" y="315" font-size="12" fill="#CBD5E1">Room-rent, co-pay &amp;</text>
    <text x="60" y="332" font-size="12" fill="#94A3B8">3h cashless SLA drafts</text>

    <!-- Pill 2 -->
    <rect x="268" y="266" width="210" height="82" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="268" y="266" width="210" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="284" y="294" font-size="13.5" font-weight="700" fill="#38BDF8">Policy Vault + CIS</text>
    <text x="284" y="315" font-size="12" fill="#CBD5E1">Table-aware PDF OCR</text>
    <text x="284" y="332" font-size="12" fill="#94A3B8">60-mo moratorium audit</text>

    <!-- Pill 3 -->
    <rect x="492" y="266" width="210" height="82" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="492" y="266" width="210" height="3" rx="1.5" fill="#F59E0B"/>
    <text x="508" y="294" font-size="13.5" font-weight="700" fill="#FBBF24">Motor Damage AI</text>
    <text x="508" y="315" font-size="12" fill="#CBD5E1">Car &amp; 2-wheeler vision</text>
    <text x="508" y="332" font-size="12" fill="#94A3B8">YOLOv8 + sklearn sidecar</text>

    <!-- Pill 4 -->
    <rect x="716" y="266" width="210" height="82" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="716" y="266" width="210" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="732" y="294" font-size="13.5" font-weight="700" fill="#C4B5FD">Parinidhi RAG + Voice</text>
    <text x="732" y="315" font-size="12" fill="#CBD5E1">Clause-cited chat &amp;</text>
    <text x="732" y="332" font-size="12" fill="#94A3B8">Tavily / Serper research</text>

    <!-- Pill 5 -->
    <rect x="940" y="266" width="216" height="82" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="940" y="266" width="216" height="3" rx="1.5" fill="#F43F5E"/>
    <text x="956" y="294" font-size="13.5" font-weight="700" fill="#FB7185">Browser Shield v2.1</text>
    <text x="956" y="315" font-size="12" fill="#CBD5E1">Chrome, WA, Gmail &amp; TG</text>
    <text x="956" y="332" font-size="12" fill="#94A3B8">VirusTotal + RDAP + APK</text>
  </g>
</svg>
