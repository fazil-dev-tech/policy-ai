<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" role="img" aria-label="PolicyGuard AI — IRDAI 2024 Claims Intelligence, Motor Vision Estimator &amp; Browser Scam Shield">
  <defs>
    <radialGradient id="stageBg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0B1124"/>
      <stop offset="68%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#030612"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="22%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="84%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#070B16" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="hudGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- Exact rounded clips for bottom 5 cards so top bars never overhang corners -->
    <clipPath id="pillClip1"><rect x="48" y="282" width="208" height="92" rx="14"/></clipPath>
    <clipPath id="pillClip2"><rect x="272" y="282" width="208" height="92" rx="14"/></clipPath>
    <clipPath id="pillClip3"><rect x="496" y="282" width="208" height="92" rx="14"/></clipPath>
    <clipPath id="pillClip4"><rect x="720" y="282" width="208" height="92" rx="14"/></clipPath>
    <clipPath id="pillClip5"><rect x="944" y="282" width="208" height="92" rx="14"/></clipPath>

    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes sweepGlow { 0% { opacity: 0.45; } 50% { opacity: 1; } 100% { opacity: 0.45; } }
      .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }
      .sweep-line { animation: sweepGlow 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot, .sweep-line { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Main Obsidian Stage -->
  <rect x="4" y="4" width="1192" height="402" rx="22" fill="url(#stageBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="402" rx="22" fill="url(#hudGrid)"/>
  <rect x="4" y="4" width="1192" height="402" rx="22" fill="url(#glowRose)"/>
  <rect x="4" y="4" width="1192" height="402" rx="22" fill="url(#glowCyan)"/>

  <!-- HUD Corner L-Brackets matching PolicyGuard 3D Stage -->
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 1164 18 L 1182 18 L 1182 36" fill="none" stroke="#EC4899" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 18 374 L 18 392 L 36 392" fill="none" stroke="#EC4899" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 1164 392 L 1182 392 L 1182 374" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Top Ambient Accent Line -->
  <rect class="sweep-line" x="64" y="4" width="1072" height="3" rx="1.5" fill="url(#brandGrad)"/>

  <!-- Left Column: Brand Messaging -->
  <g transform="translate(52, 44)">
    <!-- Generous Eyebrow Pill -->
    <rect x="0" y="0" width="468" height="32" rx="16" fill="#E11D48" fill-opacity="0.13" stroke="#FB7185" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle class="pulse-dot" cx="20" cy="16" r="4.5" fill="#FB7185"/>
    <text x="36" y="20.5" class="mono" font-size="12" font-weight="700" letter-spacing="1.2" fill="#FDA4AF">
      POLICYGUARD AI · INSURTECH &amp; SCAM SHIELD
    </text>

    <!-- Main Hero Heading -->
    <text x="0" y="96" class="sans" font-size="58" font-weight="800" letter-spacing="-1.2" fill="url(#titleGrad)">
      PolicyGuard AI
    </text>

    <!-- Subtitle with generous breathing room -->
    <text x="2" y="134" class="sans" font-size="18.5" font-weight="600" fill="#E2E8F0">
      Deterministic IRDAI 2024 Claims Engine &amp; Policy Vault
    </text>
    <text x="2" y="162" class="sans" font-size="16" font-weight="400" fill="#94A3B8">
      Table-Aware PDF OCR · YOLOv8 Motor Estimator · Parinidhi Voice RAG · Chrome MV3
    </text>

    <!-- Quick Spec Chips -->
    <rect x="0" y="182" width="166" height="28" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="83" y="200" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#CBD5E1">REACT 18 + 3D</text>

    <rect x="178" y="182" width="174" height="28" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="265" y="200" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#CBD5E1">EXPRESS + RLS</text>

    <rect x="364" y="182" width="196" height="28" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="462" y="200" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#CBD5E1">FASTAPI + YOLOV8</text>
  </g>

  <!-- Right Column: Live Telemetry & Animated 3D-Style Orbital Shield Card -->
  <g transform="translate(744, 38)">
    <rect x="0" y="0" width="408" height="214" rx="16" fill="url(#glassCard)" stroke="#334155" stroke-width="1.4"/>
    <line x1="16" y1="40" x2="392" y2="40" stroke="#1E293B" stroke-width="1"/>

    <!-- Header bar inside HUD -->
    <circle cx="22" cy="21" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="25" class="mono" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#6EE7B7">
      LIVE ON VERCEL + SUPABASE
    </text>
    <text x="390" y="25" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#22D3EE">
      v1.1 · MV3 v2.1
    </text>

    <!-- Animated Orbital Shield Emblem -->
    <g transform="translate(96, 128)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="4 5"/>
      <!-- Rotating Outer Cyan Orbit -->
      <g>
        <ellipse cx="0" cy="0" rx="68" ry="26" transform="rotate(-28)" fill="none" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
        <circle cx="58" cy="-16" r="4" fill="#22D3EE"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      </g>
      <!-- Counter-rotating Rose Orbit -->
      <g>
        <ellipse cx="0" cy="0" rx="68" ry="26" transform="rotate(28)" fill="none" stroke="#EC4899" stroke-opacity="0.6" stroke-width="1.5"/>
        <circle cx="-58" cy="14" r="4" fill="#FB7185"/>
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="11s" repeatCount="indefinite"/>
      </g>
      <!-- Core Shield -->
      <path d="M0,-40 L34,-24 L34,6 C34,27 18,41 0,48 C-18,41 -34,27 -34,6 L-34,-24 Z"
            fill="#090D1A" stroke="url(#shieldCore)" stroke-width="2.6"/>
      <path d="M0,-30 L25,-18 L25,5 C25,20 13,31 0,36 C-13,31 -25,20 -25,5 L-25,-18 Z"
            fill="url(#shieldCore)" fill-opacity="0.16"/>
      <path d="M-11,3 L-2,12 L14,-7" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right-side mini telemetry bars -->
    <g transform="translate(184, 58)">
      <rect x="0" y="0" width="204" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#1E293B"/>
      <text x="12" y="17" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">IRDAI Math Accuracy</text>
      <text x="12" y="32" class="mono" font-size="10.5" fill="#6EE7B7">ZERO-LLM DETERMINISTIC</text>

      <rect x="0" y="48" width="204" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#1E293B"/>
      <text x="12" y="65" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Browser &amp; Chat Guard</text>
      <text x="12" y="80" class="mono" font-size="10.5" fill="#67E8F9">WEB · WA · GMAIL · TG · IG</text>

      <rect x="0" y="96" width="204" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#1E293B"/>
      <text x="12" y="113" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">Signed Storage Vault</text>
      <text x="12" y="128" class="mono" font-size="10.5" fill="#FDA4AF">10 MB PDF + DPDP MASK</text>
    </g>
  </g>

  <!-- Subtle Section Divider -->
  <line x1="48" y1="266" x2="1152" y2="266" stroke="#1E293B" stroke-width="1"/>

  <!-- 5 Symmetrical Bottom Feature Cards (208px each, 16px gaps, clipped accent stripes) -->
  <g class="sans">
    <!-- Card 1: Rose -->
    <g clip-path="url(#pillClip1)">
      <rect x="48" y="282" width="208" height="92" rx="14" fill="url(#glassCard)"/>
      <rect x="48" y="282" width="208" height="4" fill="#E11D48"/>
    </g>
    <rect x="48" y="282" width="208" height="92" rx="14" fill="none" stroke="#1E293B" stroke-width="1.4"/>
    <text x="64" y="311" font-size="15" font-weight="700" fill="#FDA4AF">IRDAI Claim Math</text>
    <text x="64" y="334" font-size="13.5" fill="#E2E8F0">Room-rent, co-pay &amp;</text>
    <text x="64" y="354" font-size="13.5" fill="#94A3B8">3h cashless SLA notices</text>

    <!-- Card 2: Emerald -->
    <g clip-path="url(#pillClip2)">
      <rect x="272" y="282" width="208" height="92" rx="14" fill="url(#glassCard)"/>
      <rect x="272" y="282" width="208" height="4" fill="#10B981"/>
    </g>
    <rect x="272" y="282" width="208" height="92" rx="14" fill="none" stroke="#1E293B" stroke-width="1.4"/>
    <text x="288" y="311" font-size="15" font-weight="700" fill="#6EE7B7">Policy Vault + CIS</text>
    <text x="288" y="334" font-size="13.5" fill="#E2E8F0">Table-aware PDF OCR</text>
    <text x="288" y="354" font-size="13.5" fill="#94A3B8">60-mo moratorium audit</text>

    <!-- Card 3: Amber -->
    <g clip-path="url(#pillClip3)">
      <rect x="496" y="282" width="208" height="92" rx="14" fill="url(#glassCard)"/>
      <rect x="496" y="282" width="208" height="4" fill="#F59E0B"/>
    </g>
    <rect x="496" y="282" width="208" height="92" rx="14" fill="none" stroke="#1E293B" stroke-width="1.4"/>
    <text x="512" y="311" font-size="15" font-weight="700" fill="#FDE68A">Motor Damage AI</text>
    <text x="512" y="334" font-size="13.5" fill="#E2E8F0">Car &amp; 2-wheeler vision</text>
    <text x="512" y="354" font-size="13.5" fill="#94A3B8">YOLOv8 + sklearn model</text>

    <!-- Card 4: Pink -->
    <g clip-path="url(#pillClip4)">
      <rect x="720" y="282" width="208" height="92" rx="14" fill="url(#glassCard)"/>
      <rect x="720" y="282" width="208" height="4" fill="#EC4899"/>
    </g>
    <rect x="720" y="282" width="208" height="92" rx="14" fill="none" stroke="#1E293B" stroke-width="1.4"/>
    <text x="736" y="311" font-size="15" font-weight="700" fill="#F9A8D4">Parinidhi RAG AI</text>
    <text x="736" y="334" font-size="13.5" fill="#E2E8F0">Clause citations, voice</text>
    <text x="736" y="354" font-size="13.5" fill="#94A3B8">&amp; Tavily live research</text>

    <!-- Card 5: Cyan -->
    <g clip-path="url(#pillClip5)">
      <rect x="944" y="282" width="208" height="92" rx="14" fill="url(#glassCard)"/>
      <rect x="944" y="282" width="208" height="4" fill="#22D3EE"/>
    </g>
    <rect x="944" y="282" width="208" height="92" rx="14" fill="none" stroke="#1E293B" stroke-width="1.4"/>
    <text x="960" y="311" font-size="15" font-weight="700" fill="#67E8F9">Browser Shield MV3</text>
    <text x="960" y="334" font-size="13.5" fill="#E2E8F0">VirusTotal, RDAP age</text>
    <text x="960" y="354" font-size="13.5" fill="#94A3B8">&amp; .apk / UPI link trap</text>
  </g>
</svg>
