    <text x="0" y="84" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#F8FAFC">
      PolicyGuard AI
    </text>

    <text x="2" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18.5" font-weight="500" fill="#CBD5E1">
