    <text x="815" y="346" text-anchor="middle" font-size="13" fill="#CBD5E1">RDAP + VT v3 + Allowlist</text>
    <text x="815" y="368" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8">/api/security/check-url</text>

    <!-- Module 5: Motor Damage Hub -> ML Sidecar -->
    <rect x="930" y="298" width="202" height="90" rx="12" fill="#091020" stroke="#F59E0B" stroke-opacity="0.48" stroke-width="1.3"/>
    <text x="1031" y="324" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FDE68A">Motor Damage Hub</text>
    <text x="1031" y="346" text-anchor="middle" font-size="13" fill="#CBD5E1">4W &amp; 2W Claim Triage</text>
    <text x="1031" y="368" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8">Tier-2 ML Orchestrator</text>
  </g>

