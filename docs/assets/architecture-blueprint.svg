    <text x="826" y="502" font-size="16" font-weight="700" fill="#FDE68A">Python ML Sidecar (:8000)</text>
    <text x="826" y="527" font-size="13.5" fill="#E2E8F0">FastAPI Uvicorn CPU Inference Worker</text>
    <text x="826" y="548" font-size="13.5" fill="#CBD5E1">YOLOv8n / CarDD Vehicle &amp; Part Detection</text>
    <text x="826" y="569" class="mono" font-size="12" fill="#94A3B8">scikit-learn RandomForest Cost Model</text>
