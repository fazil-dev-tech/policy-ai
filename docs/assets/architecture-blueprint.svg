  <path d="M 166,402 L 166,432 L 222,432 L 222,468" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrEmerald)"/>
  <path d="M 600,402 L 600,468" fill="none" stroke="#EC4899" stroke-width="2" marker-end="url(#arrPink)"/>
  <path d="M 818,402 L 818,432 L 656,432 L 656,468" fill="none" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrRose)"/>
  <path d="M 1034,402 L 1034,432 L 978,432 L 978,468" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrAmber)"/>

