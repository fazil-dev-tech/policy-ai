<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" role="img" aria-label="PolicyGuard AI End-to-End Architecture Blueprint">
  <defs>
    <radialGradient id="archStage" cx="50%" cy="42%" r="74%">
      <stop offset="0%" stop-color="#090E1E"/>
      <stop offset="70%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#030612"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111A30"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1528"/>
      <stop offset="50%" stop-color="#121E36"/>
      <stop offset="100%" stop-color="#0D1528"/>
    </linearGradient>
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22D3EE"/>
