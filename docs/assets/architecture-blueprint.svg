    <clipPath id="clientClipL"><rect x="48" y="92" width="528" height="88" rx="14"/></clipPath>
    <clipPath id="clientClipR"><rect x="624" y="92" width="528" height="88" rx="14"/></clipPath>
    <clipPath id="tier3Clip1"><rect x="48" y="472" width="348" height="114" rx="14"/></clipPath>
    <clipPath id="tier3Clip2"><rect x="426" y="472" width="348" height="114" rx="14"/></clipPath>
    <clipPath id="tier3Clip3"><rect x="804" y="472" width="348" height="114" rx="14"/></clipPath>

    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Outer Frame -->
