  <path d="M 312,180 L 312,216 L 600,216 L 600,250" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrCyan)"/>
  <path d="M 888,180 L 888,216 L 600,216" fill="none" stroke="#FB7185" stroke-opacity="0.7" stroke-width="2"/>
