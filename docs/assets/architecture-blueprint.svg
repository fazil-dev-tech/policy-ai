  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 1164 18 L 1182 18 L 1182 36" fill="none" stroke="#EC4899" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 18 584 L 18 602 L 36 602" fill="none" stroke="#EC4899" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 1164 602 L 1182 602 L 1182 584" fill="none" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>

