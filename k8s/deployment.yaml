apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyguard-backend
  labels:
    app: policyguard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policyguard-backend
  template:
    metadata:
      labels:
        app: policyguard-backend
    spec:
      containers:
        - name: backend
          image: policyguard/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: policyguard-config
            - secretRef:
                name: policyguard-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: policyguard-backend-svc
spec:
  selector:
    app: policyguard-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyguard-ml
  labels:
    app: policyguard-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policyguard-ml
  template:
    metadata:
      labels:
        app: policyguard-ml
    spec:
      containers:
        - name: ml-service
          image: policyguard/ml-service:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: policyguard-ml-svc
spec:
  selector:
    app: policyguard-ml
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyguard-frontend
  labels:
    app: policyguard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policyguard-frontend
  template:
    metadata:
      labels:
        app: policyguard-frontend
    spec:
      containers:
        - name: frontend
          image: policyguard/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: policyguard-frontend-svc
spec:
  selector:
    app: policyguard-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyguard-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyguard-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: policyguard-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  SUPABASE_STORAGE_BUCKET: "policy-files"
  AI_PROVIDER: "openrouter"
  AI_MODEL: "nvidia/nemotron-3.5-lightning:free"
  AI_ALLOW_PAID: "false"
  ML_SERVICE_URL: "http://policyguard-ml-svc:8000"
  CORS_ORIGIN: "https://policyguard-ai-ecru.vercel.app"
  MAX_FILE_SIZE: "10485760"
  LOG_LEVEL: "info"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policyguard-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: policyguard.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: policyguard-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: policyguard-frontend-svc
                port:
                  number: 80
