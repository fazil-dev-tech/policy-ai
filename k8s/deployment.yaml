apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyai-backend
  labels:
    app: policyai-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: policyai-backend
  template:
    metadata:
      labels:
        app: policyai-backend
    spec:
      containers:
        - name: backend
          image: policyai/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: policyai-config
            - secretRef:
                name: policyai-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: policyai-backend-svc
spec:
  selector:
    app: policyai-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyai-frontend
  labels:
    app: policyai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policyai-frontend
  template:
    metadata:
      labels:
        app: policyai-frontend
    spec:
      containers:
        - name: frontend
          image: policyai/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: policyai-frontend-svc
spec:
  selector:
    app: policyai-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyai-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyai-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: policyai-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  CORS_ORIGIN: "https://policyai.yourdomain.com"
  MAX_FILE_SIZE: "10485760"
  LOG_LEVEL: "info"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policyai-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: policyai.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: policyai-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: policyai-frontend-svc
                port:
                  number: 80
