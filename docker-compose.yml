version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: policyai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - policyai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policyai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-policy-files}
      # Free-first AI defaults (OpenRouter :free models like NVIDIA Nemotron & Gemma 4; set AI_ALLOW_PAID=true only if using paid OpenAI/Grok keys)
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3.5-lightning:free}
      AI_ALLOW_PAID: ${AI_ALLOW_PAID:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional free-tier / web-research / threat-intel keys:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      # Optional paid providers (disabled in auto fallback unless AI_ALLOW_PAID=true):
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://127.0.0.1:8000}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
      MAX_FILE_SIZE: 10485760
    volumes:
      - logs_data:/app/logs
    networks:
      - policyai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policyai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - policyai-network

volumes:
  redis_data:
  logs_data:

networks:
  policyai-network:
    driver: bridge
