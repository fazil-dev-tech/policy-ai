version: '3.8'

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongo:
    image: mongo:7
    container_name: policyai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: policyai
    networks:
      - policyai-network

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: policyai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - policyai-network

  # ============================================
  # Backend API Server
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policyai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/policyai
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_jwt_secret_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh_secret}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_API_BASE_URL: ${GROK_API_BASE_URL:-https://api.x.ai/v1}
      CORS_ORIGIN: http://localhost
      MAX_FILE_SIZE: 10485760
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - policyai-network

  # ============================================
  # Frontend (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policyai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - policyai-network

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  policyai-network:
    driver: bridge
