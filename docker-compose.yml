version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: policyai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - policyai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policyai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-policy-files}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
      MAX_FILE_SIZE: 10485760
    volumes:
      - logs_data:/app/logs
    networks:
      - policyai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policyai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - policyai-network

volumes:
  redis_data:
  logs_data:

networks:
  policyai-network:
    driver: bridge
